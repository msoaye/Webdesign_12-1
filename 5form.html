<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h1 style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">Student Register Form</h1>
        <label for="">Full Name :</label>
        <input type="text" placeholder="Full Name"><br><br>

        <label for="">Email Address :</label>
        <input type="email" placeholder="Email Address"><br><br>

        <label for="">Password :</label>
        <input type="password" placeholder="Password"><br><br>

        <label for="">Date of Birth :</label>
        <input type="date"><br><br>

        <label for="">Gender :</label>
        <input type="radio">Female
        <input type="radio">Male <br><br>

        <label for="">Course :</label>
        <select name="Course">
            <option value="html">HTML</option>
            <option value="Css">Css</option>
            <option value="JS">JS</option>
        </select><br><br>

        <label for="">Skill U have :</label><br>
        <input type="checkbox">HTML <br>
        <input type="checkbox">CSS <br>
        <input type="checkbox">JS <br>

        <label for="">Additional Comments :</label><br>
        <textarea name="Comments" rows="3" cols="30" placeholder="Enter ur Comments"></textarea><br><br>

        <label for="">Upload your file:</label><br><br>
        <select name="" id="">
            <option value="Choose file">Choose files</option>
        </select>
        <label for="">No file Choosen</label><br><br>
        <button>Upload</button>
        <button>Register</button>
</body>
</html>
