<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" style="width: 400px; margin: auto;border: 2px solid gray;border-radius: 15px; padding: 15px;">

        <h1 style="text-shadow: 2px 2px red;"><i>Register</i></h1>

        <label for="">First Name</label>
        <input type="text" placeholder="Enter FirstName"><br><br>

        <label for="">Last Name</label>
        <input type="text" placeholder="Enter LastName"><br><br>

        <label for="">Enter Email</label>
        <input type="email" placeholder="Enter Email"> <br><br>

        <label for="">Enter Password</label>
        <input type="password" placeholder="Enter Password"><br><br>

        <label for="">Confirm Password</label>
        <input type="password" placeholder="Confirm Password"><br><br>

        <label for="">Number</label>
        <input type="number" placeholder="number" min="0" max="100"><br><br>

        <label for="">Data</label>
        <input type="data" min="2000-01-01" max="2026-01-01">
            <label for="data"></label>
            <input type="data"> <br><br>

        <input type="checkbox">
        <label for="">Do u still want to submit</label><br><br>

        <button type="submit" style="background-color: green;">submit</button>
        <button type="reset" style="background-color: red;">Reset</button>



    </form>
    
</body>
</html>
